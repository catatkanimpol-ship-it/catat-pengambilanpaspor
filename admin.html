<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin Paspor</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: 'Segoe UI', Arial;
  margin: 0;
  background: #eef2f7;
}

/* HEADER */
.header {
  background: #0b2a4a;
  padding: 15px;
}

.header-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1100px;
  margin: auto;
}

.logo { width: 55px; }

.title {
  color: #f1c40f;
  text-align: center;
  flex: 1;
  font-weight: bold;
  font-size: 16px;
}

/* CONTAINER */
.container {
  max-width: 1100px;
  margin: 25px auto;
  padding: 0 15px;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

/* INPUT */
input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

/* BUTTON */
button {
  padding: 12px;
  border: none;
  border-radius: 8px;
  margin-top: 10px;
  cursor: pointer;
  font-weight: bold;
}

.btn-export { background: green; color: white; width: 100%; }
.btn-danger { background: red; color: white; }

/* TABLE */
.table-container {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 800px;
}

th, td {
  padding: 10px;
  border: 1px solid #ddd;
  text-align: center;
}

th {
  background: #0b2a4a;
  color: white;
}

/* RESPONSIVE */
@media (max-width: 600px) {
  .title { font-size: 13px; }
  .logo { width: 45px; }
}
</style>
</head>

<body>

<div class="header">
  <div class="header-content">
    <img src="logo-kemenimipas.png" class="logo">
    <div class="title">
      DASHBOARD ADMIN PENGAMBILAN PASPOR<br>
      KANTOR IMIGRASI KELAS I TPI POLONIA
    </div>
    <img src="logo-imigrasi.png" class="logo">
  </div>
</div>

<div class="container">

  <!-- SEARCH -->
  <div class="card">
    <h3>Pencarian Nama Pemohon</h3>
    <input type="text" id="search" placeholder="Ketik nama..." onkeyup="filterData()">
  </div>

  <!-- EXPORT -->
  <div class="card">
    <h3>Export Data Pengambilan</h3>
    <button class="btn-export" onclick="exportExcel()">Download Excel</button>
  </div>

  <!-- TABLE -->
  <div class="card">
    <h3>Data Pengambilan Paspor (Realtime)</h3>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nama Pemohon</th>
            <th>No Paspor</th>
            <th>Tanggal</th>
            <th>Nama Pengambil</th>
            <th>No Telepon</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="data"></tbody>
      </table>
    </div>

  </div>

</div>

<!-- XLSX -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC77pb28Mziag1YsweWznokG5JA0ssfmJc",
  authDomain: "catat-2a83e.firebaseapp.com",
  projectId: "catat-2a83e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let semuaData = [];

/* REALTIME DATA DARI INDEX */
db.collection("pengambilan_paspor").orderBy("tanggal", "desc")
.onSnapshot(snapshot => {
  semuaData = [];

  snapshot.forEach(doc => {
    semuaData.push({ id: doc.id, ...doc.data() });
  });

  tampilkanData(semuaData);
});

/* TAMPILKAN */
function tampilkanData(data) {
  let html = "";

  data.forEach(d => {
    html += `
      <tr>
        <td>${d.nama}</td>
        <td>${d.paspor}</td>
        <td>${d.tanggal}</td>
        <td>${d.pengambil}</td>
        <td>${d.telepon}</td>
        <td>
          <button class="btn-danger" onclick="hapus('${d.id}')">Hapus</button>
        </td>
      </tr>
    `;
  });

  document.getElementById("data").innerHTML = html;
}

/* SEARCH */
function filterData() {
  let keyword = document.getElementById("search").value.toLowerCase();

  let hasil = semuaData.filter(d =>
    d.nama.toLowerCase().includes(keyword)
  );

  tampilkanData(hasil);
}

/* HAPUS */
function hapus(id) {
  if (!confirm("Hapus data ini?")) return;

  db.collection("pengambilan_paspor").doc(id).delete();
}

/* EXPORT */
function exportExcel() {
  let dataExport = semuaData.map(d => ({
    "Nama Pemohon": d.nama,
    "No Paspor": d.paspor,
    "Tanggal Pengambilan": d.tanggal,
    "Nama Pengambil": d.pengambil,
    "No Telepon": d.telepon
  }));

  let ws = XLSX.utils.json_to_sheet(dataExport);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Data Paspor");

  XLSX.writeFile(wb, "laporan_pengambilan_paspor.xlsx");
}
</script>

</body>
</html>
