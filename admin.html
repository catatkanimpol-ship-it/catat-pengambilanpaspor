<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard Paspor</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  margin: 0;
}

.header {
  background: #0b2a4a;
  padding: 10px;
}

.header-content {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 900px;
  margin: auto;
}

.logo { width: 50px; }

.title {
  color: #f1c40f;
  font-weight: bold;
  text-align: center;
  flex: 1;
  font-size: 14px;
}

.container {
  max-width: 900px;
  margin: 20px auto;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #0b2a4a;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 6px;
}

button:hover { background: #081f36; }

.btn-danger {
  background: red;
}

input[type="text"], input[type="file"] {
  width: 100%;
  padding: 8px;
  margin-top: 10px;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
}

th {
  background: #0b2a4a;
  color: white;
}
</style>
</head>

<body>

<div class="header">
  <div class="header-content">
    <img src="logo-kemenimipas.png" class="logo">

    <div class="title">
      DASHBOARD ADMIN PENGAMBILAN PASPOR<br>
      KANTOR IMIGRASI KELAS I TPI POLONIA
    </div>

    <img src="logo-imigrasi.png" class="logo">
  </div>
</div>

<div class="container">

  <!-- UPLOAD EXCEL -->
  <div class="card">
    <h3>Upload Data Excel</h3>

    <input type="file" id="file" accept=".xls,.xlsx">

    <button onclick="uploadExcel()">Upload ke Firebase</button>

    <p id="status"></p>
  </div>

  <!-- SEARCH -->
  <div class="card">
    <h3>Pencarian Data Pemohon</h3>
    <input type="text" id="search" placeholder="Ketik nama pemohon..." onkeyup="filterData()">
  </div>

  <!-- TABLE -->
  <div class="card">
    <h3>Data Pengambilan Paspor</h3>

    <table>
      <thead>
        <tr>
          <th>Nama</th>
          <th>Paspor</th>
          <th>Tanggal</th>
          <th>Pengambil</th>
          <th>Telepon</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="data"></tbody>
    </table>
  </div>

</div>

<!-- XLSX -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC77pb28Mziag1YsweWznokG5JA0ssfmJc",
  authDomain: "catat-2a83e.firebaseapp.com",
  projectId: "catat-2a83e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let semuaData = [];

/* UPLOAD EXCEL */
function uploadExcel() {
  let file = document.getElementById("file").files[0];
  if (!file) return alert("Pilih file!");

  let reader = new FileReader();

  reader.onload = function(e) {
    let data = new Uint8Array(e.target.result);
    let workbook = XLSX.read(data, { type: "array" });

    let sheet = workbook.Sheets[workbook.SheetNames[0]];
    let rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

    let total = 0;

    rows.forEach(row => {
      let no_permohonan = "";
      let nama = "";
      let paspor = "";

      row.forEach(cell => {
        let text = String(cell).toLowerCase();

        if (!no_permohonan && /^[0-9]{8,}$/.test(text)) {
          no_permohonan = text;
        }

        if (!paspor && /^[a-zA-Z][0-9]+$/.test(text)) {
          paspor = cell;
        }

        if (!nama && /^[a-zA-Z\s]{5,}$/.test(cell)) {
          nama = cell;
        }
      });

      if (no_permohonan && nama && paspor) {
        db.collection("data_pemohon").add({
          no_permohonan,
          nama,
          paspor
        });
        total++;
      }
    });

    document.getElementById("status").innerHTML =
      "✅ Upload berhasil: " + total + " data";
  };

  reader.readAsArrayBuffer(file);
}

/* REALTIME DATA */
db.collection("pengambilan_paspor")
.onSnapshot(snapshot => {
  semuaData = [];

  snapshot.forEach(doc => {
    semuaData.push({ id: doc.id, ...doc.data() });
  });

  tampilkanData(semuaData);
});

/* TAMPILKAN */
function tampilkanData(data) {
  let html = "";

  data.forEach(d => {
    html += `
      <tr>
        <td>${d.nama}</td>
        <td>${d.paspor}</td>
        <td>${d.tanggal}</td>
        <td>${d.pengambil}</td>
        <td>${d.telepon}</td>
        <td>
          <button onclick="hapus('${d.id}')" style="background:red;">Hapus</button>
        </td>
      </tr>
    `;
  });

  document.getElementById("data").innerHTML = html;
}

/* SEARCH */
function filterData() {
  let keyword = document.getElementById("search").value.toLowerCase();

  let hasil = semuaData.filter(d =>
    d.nama.toLowerCase().includes(keyword)
  );

  tampilkanData(hasil);
}

/* HAPUS */
function hapus(id) {
  if (!confirm("Hapus data ini?")) return;

  db.collection("pengambilan_paspor").doc(id).delete();
}
</script>

</body>
</html>
