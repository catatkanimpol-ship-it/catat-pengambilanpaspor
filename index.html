<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulir Pengambilan Paspor</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: 'Segoe UI', Arial;
  margin: 0;
  background: #eef2f7;
}

/* HEADER */
.header {
  background: #0b2a4a;
  padding: 15px;
}

.header-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 900px;
  margin: auto;
}

.logo { width: 55px; }

.title {
  color: #f1c40f;
  text-align: center;
  flex: 1;
  font-weight: bold;
  font-size: 16px;
}

/* CONTAINER */
.container {
  width: 95%;
  max-width: 600px;
  background: white;
  margin: 25px auto;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

/* INPUT */
label {
  font-weight: 600;
  margin-top: 15px;
  display: block;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

input:focus {
  border-color: #0b2a4a;
  outline: none;
}

input[readonly] {
  background: #f1f3f6;
}

/* BUTTON */
button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  background: #0b2a4a;
  border: none;
  color: white;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #081f36;
}

#status {
  text-align: center;
  margin-top: 10px;
  font-weight: bold;
}

@media (max-width: 600px) {
  .logo { width: 45px; }
  .title { font-size: 13px; }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-content">
    <img src="logo-kemenimipas.png" class="logo">

    <div class="title">
      FORMULIR PENGAMBILAN PASPOR<br>
      KANTOR IMIGRASI KELAS I TPI POLONIA
    </div>

    <img src="logo-imigrasi.png" class="logo">
  </div>
</div>

<!-- FORM -->
<div class="container">

  <label>5 Digit Terakhir Nomor Permohonan</label>
  <input type="text" id="cari" maxlength="5" placeholder="Contoh: 12345">

  <label>Nama Pemohon</label>
  <input type="text" id="nama" readonly>

  <label>Nomor Paspor</label>
  <input type="text" id="paspor" readonly>

  <label>Tanggal Pengambilan</label>
  <input type="date" id="tanggal">

  <label>Nama Pengambil</label>
  <input type="text" id="pengambil">

  <label>No Telepon Pengambil</label>
  <input type="text" id="telepon">

  <button onclick="kirimData()">Kirim Data</button>

  <p id="status"></p>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC77pb28Mziag1YsweWznokG5JA0ssfmJc",
  authDomain: "catat-2a83e.firebaseapp.com",
  projectId: "catat-2a83e",
  storageBucket: "catat-2a83e.firebasestorage.app",
  messagingSenderId: "457830020525",
  appId: "1:457830020525:web:009ac7894a79f20b4f5d24"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* AUTO ISI DATA */
document.getElementById("cari").addEventListener("keyup", function() {
  let input = this.value;

  if (input.length === 5) {

    db.collection("data_pemohon").get().then(snapshot => {

      let found = false;

      snapshot.forEach(doc => {
        if (found) return; // 🔥 STOP kalau sudah ketemu

        let data = doc.data();

        if (String(data.no_permohonan).endsWith(input)) {

          document.getElementById("nama").value = data.nama;
          document.getElementById("paspor").value = data.paspor;

          found = true;
        }
      });

      if (!found) {
        document.getElementById("nama").value = "Data tidak ditemukan";
        document.getElementById("paspor").value = "-";
      }

    });
  }
});
/* KIRIM DATA */
function kirimData() {

  let nama = document.getElementById("nama").value;
  let paspor = document.getElementById("paspor").value;
  let tanggal = document.getElementById("tanggal").value;
  let pengambil = document.getElementById("pengambil").value;
  let telepon = document.getElementById("telepon").value;

  if (!nama || nama === "Data tidak ditemukan") {
    alert("Data pemohon tidak valid!");
    return;
  }

  if (!tanggal || !pengambil || !telepon) {
    alert("Harap isi semua data!");
    return;
  }

  db.collection("pengambilan_paspor").add({
    nama: nama,
    paspor: paspor,
    tanggal: tanggal,
    pengambil: pengambil,
    telepon: telepon
  })
  .then(() => {
    document.getElementById("status").innerHTML = "✅ Data berhasil dikirim!";
  })
  .catch((err) => {
    console.error(err);
    document.getElementById("status").innerHTML = "❌ Gagal kirim data";
  });
}
</script>

</body>
</html>
