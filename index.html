<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulir Pengambilan Paspor</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Arial;
  margin: 0;
  background: #eef2f7;
}

/* HEADER */
.header {
  background: #0b2a4a;
  padding: 20px 10px;
}

.header-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 900px;
  margin: auto;
}

.logo {
  width: 60px;
}

.title {
  color: #f1c40f;
  font-weight: bold;
  text-align: center;
  flex: 1;
  font-size: 18px;
  line-height: 1.4;
  padding: 0 10px;
}

/* CONTAINER */
.container {
  width: 95%;
  max-width: 600px;
  background: white;
  margin: 30px auto;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

/* LABEL */
label {
  font-weight: 600;
  display: block;
  margin-top: 18px;
  font-size: 15px;
  color: #333;
}

/* INPUT */
input {
  width: 100%;
  padding: 14px;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 15px;
  transition: 0.2s;
}

input:focus {
  border-color: #0b2a4a;
  outline: none;
}

input[readonly] {
  background: #f1f3f6;
}

/* BUTTON */
button {
  width: 100%;
  margin-top: 25px;
  padding: 15px;
  background: #0b2a4a;
  border: none;
  font-weight: bold;
  color: white;
  cursor: pointer;
  border-radius: 8px;
  font-size: 16px;
  transition: 0.2s;
}

button:hover {
  background: #081f36;
}

#status {
  text-align: center;
  margin-top: 12px;
  font-weight: bold;
}

/* RESPONSIVE */
@media (max-width: 600px) {
  .title {
    font-size: 14px;
  }

  .logo {
    width: 45px;
  }

  .container {
    padding: 20px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-content">
    <img src="logo-kemenimipas.png" class="logo">

    <div class="title">
      FORMULIR PENGAMBILAN PASPOR<br>
      KANTOR IMIGRASI KELAS I TPI POLONIA
    </div>

    <img src="logo-imigrasi.png" class="logo">
  </div>
</div>

<!-- FORM -->
<div class="container">

  <label>5 Digit Terakhir Nomor Permohonan</label>
  <input type="text" id="cari" maxlength="5" placeholder="Contoh: 12345">

  <label>Nama Pemohon</label>
  <input type="text" id="nama" readonly>

  <label>Nomor Paspor</label>
  <input type="text" id="paspor" readonly>

  <label>Tanggal Pengambilan</label>
  <input type="date" id="tanggal">

  <label>Nama Pengambil</label>
  <input type="text" id="pengambil" placeholder="Isi nama pengambil">

  <label>No Telepon Pengambil</label>
  <input type="text" id="telepon" placeholder="08xxxx">

  <button onclick="kirimData()">Kirim Data</button>

  <p id="status"></p>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC77pb28Mziag1YsweWznokG5JA0ssfmJc",
  authDomain: "catat-2a83e.firebaseapp.com",
  projectId: "catat-2a83e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* AUTO ISI */
document.getElementById("cari").addEventListener("keyup", function() {
  let input = this.value;

  if (input.length === 5) {
    db.collection("data_pemohon").get().then(snapshot => {
      let found = false;

      snapshot.forEach(doc => {
        let data = doc.data();

        if (data.no_permohonan.endsWith(input)) {
          document.getElementById("nama").value = data.nama;
          document.getElementById("paspor").value = data.paspor;
          found = true;
        }
      });

      if (!found) {
        document.getElementById("nama").value = "Data tidak ditemukan";
        document.getElementById("paspor").value = "-";
      }
    });
  }
});

/* SIMPAN */
function kirimData() {
  db.collection("pengambilan_paspor").add({
    nama: document.getElementById("nama").value,
    paspor: document.getElementById("paspor").value,
    tanggal: document.getElementById("tanggal").value,
    pengambil: document.getElementById("pengambil").value,
    telepon: document.getElementById("telepon").value
  }).then(() => {
    document.getElementById("status").innerHTML = "✅ Data berhasil dikirim!";
  }).catch(() => {
    document.getElementById("status").innerHTML = "❌ Gagal kirim data";
  });
}
</script>

</body>
</html>
